name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [premium-product-evolution]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Production build
        env:
          CI: "true"
        run: yarn build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/server.py

      - name: Import application
        env:
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-admin-password-123
          MONGO_URL: mongodb://localhost:27017
        run: python -c "import sys; sys.path.insert(0, 'backend'); import server; print(server.app.title)"
