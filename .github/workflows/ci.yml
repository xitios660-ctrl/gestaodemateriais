name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, premium-product-evolution, cinematic-experience]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Session regression tests
        env:
          CI: "true"
        run: yarn test --watchAll=false --runInBand

      - name: Production build
        env:
          CI: "true"
        run: yarn build

  docker:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build --tag gestao-de-materiais:ci .

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Compile backend
        run: python -m py_compile backend/server.py

      - name: Import application
        env:
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-admin-password-123
          MONGO_URL: mongodb://localhost:27017
        run: python -c "import sys; sys.path.insert(0, 'backend'); import server; print(server.app.title)"

      - name: Security and workflow tests
        env:
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-admin-password-123
          MONGO_URL: mongodb://localhost:27017
        run: PYTHONPATH=backend pytest -q backend/tests/test_security_helpers.py backend/tests/test_experience_flows.py
